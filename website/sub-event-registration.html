<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for a Sub-Event at Masters Kerala RE Expo 2026.">
    <title>Sub-Event Registration - Masters Expo 2026</title>

    <link rel="icon" type="image/png" href="./assets/logo/favic.png">
    <link rel="stylesheet" href="./style-css/main.css">
    <link rel="stylesheet" href="./style-css/mscol.css">
    <link rel="stylesheet" href="./style-css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Supabase JS SDK & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./script/js/supabase-config.js"></script>

    <!-- Meta Pixel Code -->

    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');

    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=27988637077489028&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->
</head>

<body>
    <!-- HEADER -->
    <header class="header hdr2">
        <div class="hdr-cont">
            <div class="container">
                <div class="header-conts">
                    <div class="hdr-logos">
                        <a href="index.html"><img src="./assets/logo/logo3.png" alt="Masters Expo"></a>
                        <img src="./assets/logo/1.png" alt="Partner Logo">
                    </div>
                    <div class="pg-cnt-btn">
                        <a href="index.html#cnct"><div class="ind-cnct-btn"><p>Contact</p></div></a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="vis-pg">
        <section class="vis-sec">
            <div class="container">
                <div class="visit-reg-contain">
                    <div class="row">
                        <!-- REGISTRATION FORM -->
                        <div class="col-md-6 col-lg-4">
                            <div class="vist-form-contain">
                                <h2><span id="eventTitle">Sub-Event</span> Registration</h2>
                                <form id="subEventForm" novalidate>
                                    <input type="hidden" name="country" id="country" value="India">
                                    <input type="hidden" name="slug" id="slugInput" value="">

                                    <!-- Country Code -->
                                    <div class="vist-input">
                                        <select name="countryCode" id="code" required>
                                            <option data-country="India" value="91" selected>India (+91)</option>
                                            <option data-country="United Arab Emirates" value="971">UAE (+971)</option>
                                            <option data-country="Malaysia" value="60">Malaysia (+60)</option>
                                            <option data-country="Indonesia" value="62">Indonesia (+62)</option>
                                            <optgroup label="Other countries">
                                                <option data-country="Australia" value="61">Australia (+61)</option>
                                                <option data-country="Canada" value="1">Canada (+1)</option>
                                                <option data-country="Germany" value="49">Germany (+49)</option>
                                                <option data-country="Singapore" value="65">Singapore (+65)</option>
                                                <option data-country="UK" value="44">UK (+44)</option>
                                                <option data-country="USA" value="1">USA (+1)</option>
                                            </optgroup>
                                        </select>
                                    </div>

                                    <!-- Mobile -->
                                    <div class="vist-input option2">
                                        <input class="fr-rmv-str" type="number" placeholder="Your Phone" name="mobile" required>
                                        <span class="req-star phn">*</span>
                                    </div>

                                    <!-- Name -->
                                    <div class="vist-input option2">
                                        <input class="fr-rmv-str" type="text" name="name" placeholder="Your Name" required>
                                        <span class="req-star nm">*</span>
                                    </div>

                                    <!-- Visit Profile -->
                                    <div class="vist-input option2">
                                        <select name="visit_profile" required id="visitProfile">
                                            <option value="">Select Visit Profile</option>
                                            <option value="Component Manufacturer / Supplier">Component Manufacturer / Supplier</option>
                                            <option value="EPC/ MNRE vendors / system integrator">EPC/ MNRE Vendors / System Integrator</option>
                                            <option value="EPC professional / Employee">EPC Professional / Employee</option>
                                            <option value="Masters Association member">Masters Association Member</option>
                                            <option value="Government Organization">Government Organization</option>
                                            <option value="Investor / Project Developer">Investor / Project Developer</option>
                                            <option value="Distributor/wholesaler/trader">Distributor / Wholesaler / Trader</option>
                                            <option value="Media">Media</option>
                                            <option value="Student">Student</option>
                                            <option value="Consumer">Consumer</option>
                                            <option value="Public">Public</option>
                                        </select>
                                        <span class="req-star vstr">*</span>
                                    </div>

                                    <!-- Email -->
                                    <div class="vist-input">
                                        <input class="fr-rmv-str" type="email" placeholder="Your Email" name="email">
                                    </div>

                                    <!-- Company -->
                                    <div class="vist-input">
                                        <input class="fr-rmv-str" type="text" placeholder="Company Name" name="company_name">
                                        <span class="req-star orgtn">*</span>
                                    </div>

                                    <!-- Designation -->
                                    <div class="vist-input">
                                        <input class="fr-rmv-str" type="text" placeholder="Designation" name="designation">
                                        <span class="req-star dsgntn">*</span>
                                    </div>

                                    <!-- Address -->
                                    <div class="vist-input">
                                        <textarea name="address" placeholder="Enter Address"></textarea>
                                    </div>

                                    <!-- City -->
                                    <div class="vist-input option2">
                                        <input class="fr-rmv-str" type="text" placeholder="City" name="city">
                                    </div>

                                    <!-- State -->
                                    <div class="vist-input">
                                        <input class="fr-rmv-str" type="text" placeholder="State/Province" name="state">
                                    </div>

                                    <!-- Pincode -->
                                    <div class="vist-input">
                                        <input class="fr-rmv-str" type="number" placeholder="Pincode/Zipcode" name="pincode">
                                        <span class="req-star pncd">*</span>
                                    </div>

                                    <!-- Agree checkbox -->
                                    <div class="vist-input">
                                        <div style="display:flex;align-items:baseline;gap:10px;">
                                            <input type="checkbox" id="receiveupdate" name="receiveupdate" value="receiveupdate">
                                            <label for="receiveupdate" class="chck-lab">
                                                <p style="font-size:14px;">I agree to receive all updates through SMS and Email</p>
                                            </label>
                                        </div>
                                    </div>

                                    <!-- Submit -->
                                    <div class="vist-input">
                                        <button type="submit" id="sub-btn" class="vist-regis-btn" disabled>Register</button>
                                        <button type="button" class="buttonload vist-regis-btn" id="sub-loading-btn" style="display:none;">
                                            <i class="fa fa-spinner fa-spin"></i> Submitting...
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <!-- EVENT INFO -->
                        <div class="col-md-6 col-lg-8">
                            <div class="visit-cont-contain">
                                <div class="visit-cont-blk">
                                    <div class="vis-img">
                                        <a href="index.html"><img src="./assets/logo/logo3.png" alt="Masters Expo Logo"></a>
                                    </div>
                                    <div class="vist-cont">
                                        <div class="vist-dt-blk">
                                            <div class="mnth"><span>September 2026</span></div>
                                            <div class="vis-dt">
                                                <span><ul><li>25</li><li>26</li><li>27</li></ul></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- SUCCESS MODAL -->
        <div class="badge-modal-contain">
            <div class="bdg-overlay"></div>
            <div class="bdg-modal">
                <div class="bdg-contain">
                    <div><span class="close"><i class="fa-solid fa-xmark"></i></span></div>
                    <div class="bdge-cont"><p>Registration Successful! 🎉</p></div>
                    <div class="vist-dt-blk">
                        <div class="mnth"><span>September 2026</span></div>
                        <div class="vis-dt"><span><ul><li>25</li><li>26</li><li>27</li></ul></span></div>
                    </div>
                    <div class="generate-bdg">
                        <a id="generateBadge" href="#" target="_blank">Generate &amp; Print Badge</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <div class="foot-fl">
                <div class="foot-lft">
                    <div class="foot-logo">
                        <a href="index.html"><img src="./assets/logo/logoblc.png" alt="Masters Logo"></a>
                        <p>Powering the World's Clean Energy Future</p>
                        <a href="https://solarmasters.org/" target="_blank"><h3>Masters Association</h3></a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // Read slug from URL param (e.g. ?slug=tech-conference)
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug') || '';
        document.getElementById('slugInput').value = slug;
        if (slug) {
            // Show slug as title (formatted)
            document.getElementById('eventTitle').textContent = slug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        }

        // Sync country from select
        document.getElementById('code').addEventListener('change', function() {
            const selected = this.options[this.selectedIndex];
            document.getElementById('country').value = selected.getAttribute('data-country') || 'India';
        });

        // Enable submit on checkbox
        document.getElementById('receiveupdate').addEventListener('change', function() {
            document.getElementById('sub-btn').disabled = !this.checked;
        });

        // Close modal
        document.querySelectorAll('.bdg-contain .close, .bdg-overlay').forEach(el => {
            el.addEventListener('click', () => {
                document.querySelector('.bdg-overlay').classList.remove('show');
                document.querySelector('.bdg-modal').classList.remove('show');
            });
        });

        // FORM SUBMISSION
        document.getElementById('subEventForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const btn     = document.getElementById('sub-btn');
            const loadBtn = document.getElementById('sub-loading-btn');
            btn.style.display     = 'none';
            loadBtn.style.display = 'inline-block';

            const formData = new FormData(this);
            formData.append('company_id',    '12');
            formData.append('exhibition_id', '20');

            console.log('🚀 [Sub-Event Register] Submitting sub-event registration form:', Object.fromEntries(formData.entries()));

            // Save to Supabase
            if (window.expoSupabase) {
                console.log('💾 [Supabase Sub-Event] Inserting row into sub_event_registrations table...');
                Promise.resolve(
                    window.expoSupabase
                        .from('sub_event_registrations')
                        .insert([{
                            event_slug: formData.get('slug'),
                            name: formData.get('name'),
                            country_code: formData.get('countryCode'),
                            mobile: formData.get('mobile'),
                            email: formData.get('email'),
                            visit_profile: formData.get('visit_profile'),
                            company_name: formData.get('company_name'),
                            designation: formData.get('designation'),
                            address: formData.get('address'),
                            city: formData.get('city'),
                            state: formData.get('state'),
                            pincode: formData.get('pincode')
                        }])
                )
                .then(res => console.log('✅ [Supabase Sub-Event] Record saved:', res))
                .catch(err => console.warn('⚠️ [Supabase Sub-Event Notice]:', err));
            }

            fetch('https://event.rowbest.in/api/sub-event-visitor-reg', {
                method: 'POST',
                body: formData
            })
            .then(r => r.json())
            .then(data => {
                if (data.status) {
                    const visitor = {
                        name:          formData.get('name'),
                        profile:       formData.get('visit_profile'),
                        company_name:  formData.get('company_name'),
                        designation:   formData.get('designation'),
                        city:          formData.get('city'),
                        mobile_code:   formData.get('countryCode'),
                        mobile_number: formData.get('mobile')
                    };
                    const qrId    = data.id       || data.qr_id   || '';
                    const badgeNo = data.badge_id  || data.badge_no || '';
                    const url = `badge.html?qr_id=${qrId}&badge_no=${badgeNo}&visitor=${encodeURIComponent(JSON.stringify(visitor))}`;
                    document.getElementById('generateBadge').href = url;
                    document.querySelector('.bdg-overlay').classList.add('show');
                    document.querySelector('.bdg-modal').classList.add('show');
                } else {
                    alert(data.message || data.msg || 'Registration failed. Please check your inputs.');
                }
            })
            .catch(err => {
                console.error(err);
                alert('Network error. Please check your connection and try again.');
            })
            .finally(() => {
                btn.style.display     = 'inline-block';
                loadBtn.style.display = 'none';
            });
        });
    </script>
</body>
</html>
